name: Publicar homologação no GitHub Pages

on:
  push:
    branches: [homolog]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/homolog'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Obter código
        uses: actions/checkout@v4
      - name: Validar JavaScript
        run: npm run check
      - name: Preparar arquivos públicos
        run: |
          mkdir -p _site
          cp index.html style.css app.js form-model.js speech-input.js favicon.svg _site/
          cp -R assets _site/
      - name: Configurar Pages
        uses: actions/configure-pages@v5
      - name: Enviar arquivos estáticos
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
